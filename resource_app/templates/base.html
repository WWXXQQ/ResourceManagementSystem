{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物料资源管理系统</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #0f1115; color: #f0f0f5; }
        .layout { display: flex; min-height: 100vh; }
        .sidebar { width: 240px; padding: 24px; border-right: 1px solid #2a2d36; }
        .main { flex: 1; padding: 40px; }
        a { color: inherit; text-decoration: none; }
        .nav-link { display: block; margin: 12px 0; padding: 10px 12px; background: #20232b; border-radius: 8px; }
        .panel { background: #171a21; border: 1px solid #2a2d36; border-radius: 12px; padding: 24px; }
        input, select, button { width: 100%; box-sizing: border-box; padding: 10px 12px; margin-top: 6px; }
        button { cursor: pointer; background: #6366f1; color: white; border: 0; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <h2>资源管理</h2>
            <a class="nav-link" href="{% url 'dashboard' %}">首页</a>
            {% if request.user.is_authenticated %}
            <a class="nav-link" href="{% url 'logout' %}">退出登录</a>
            {% endif %}
        </aside>
        <main class="main">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
